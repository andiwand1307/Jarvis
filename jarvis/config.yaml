name: Jarvis
version: "0.1.0"
slug: jarvis
description: Persönlicher Aktionsagent mit Claude – Mail, Todoist, Kalender und Home Assistant
url: https://github.com/andiwand1307/jarvis
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: Jarvis
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8099]/api/health
options:
  anthropic_api_key: ""
  model: claude-opus-5-5
  effort: medium
  user_name: ""
  web_search: true
  todoist_api_token: ""
  mail_imap_host: ""
  mail_imap_port: 993
  mail_smtp_host: ""
  mail_smtp_port: 465
  mail_smtp_security: ssl
  mail_user: ""
  mail_password: ""
  mail_from: ""
  mail_drafts_folder: ""
schema:
  anthropic_api_key: password
  model: str
  effort: list(low|medium|high|xhigh|max)
  user_name: str?
  web_search: bool
  todoist_api_token: password?
  mail_imap_host: str?
  mail_imap_port: port
  mail_smtp_host: str?
  mail_smtp_port: port
  mail_smtp_security: list(ssl|starttls)
  mail_user: str?
  mail_password: password?
  mail_from: str?
  mail_drafts_folder: str?
