; "Fritzbox-Double": Registrar mit Digest-Auth wie eine Fritzbox (IP-Telefon 620/621)
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[tpl](!)
type=endpoint
context=fritz
disallow=all
allow=alaw,ulaw,g722
direct_media=no
dtmf_mode=rfc4733
timers=yes
timers_sess_expires=180
timers_min_se=90

[620](tpl)
auth=620
aors=620
callerid="Jarvis" <620>
[620]
type=auth
auth_type=userpass
username=620
password=geheim620
realm=fritz.box
[620]
type=aor
max_contacts=2
remove_existing=yes
minimum_expiration=30
default_expiration=300

[621](tpl)
auth=621
aors=621
callerid="Handy" <621>
[621]
type=auth
auth_type=userpass
username=621
password=geheim621
realm=fritz.box
[621]
type=aor
max_contacts=2
remove_existing=yes
